# Serves the published Blazor WebAssembly SPA. Client-side routes (/grill,
# /health) don't exist as files, so unmatched paths fall back to index.html
# and the Blazor router takes it from there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx:alpine's mime.types already maps .wasm; set it explicitly in
    # case an older image is used, since a wrong type stops the browser
    # from instantiating the module.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript application/javascript;
}
