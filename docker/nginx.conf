# Serves the published Blazor WebAssembly SPA and reverse-proxies the
# sidecar's HTTP API under /api/, so the whole app is one origin — needed
# for a single Cloudflare Tunnel hostname and for auth_basic below to cover
# both the page and its API calls with one login. Client-side routes
# (/grill, /health) don't exist as files, so unmatched paths fall back to
# index.html and the Blazor router takes it from there.
#
# 127.0.0.11 is Docker Compose's embedded DNS; re-resolving per-request
# (via the variable in proxy_pass) rather than once at nginx startup means
# this keeps working if the sidecar container is recreated on its own.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fixed username/password so the app isn't wide open once it's reachable
    # from the internet (e.g. via a Cloudflare Tunnel). See docker/README.md
    # for how to create docker/.htpasswd — it's git-ignored, not baked into
    # the image, and mounted in by docker-compose.yml.
    auth_basic "OpenPit32";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Using a variable in proxy_pass (needed below so nginx re-resolves
        # "sidecar" per request instead of caching its IP at startup) means
        # nginx no longer strips the location prefix on its own — do it
        # explicitly, or every request would arrive at the sidecar as
        # /api/health instead of /health and 404.
        rewrite ^/api/(.*)$ /$1 break;
        set $sidecar http://sidecar:8091;
        proxy_pass $sidecar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx:alpine's mime.types already maps .wasm; set it explicitly in
    # case an older image is used, since a wrong type stops the browser
    # from instantiating the module.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript application/javascript;
}
