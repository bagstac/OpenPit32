<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPit32</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="OpenPit32.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2b1c14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OpenPit32" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Service workers require a secure context (HTTPS or localhost); on
        // the plain-HTTP LAN address navigator.serviceWorker is undefined,
        // so guard the call rather than let it throw.
        //
        // updateViaCache: 'none' (2026-09-12) — the default ('imports') lets
        // the browser serve service-worker-assets.js (imported via
        // service-worker.published.js's importScripts(), and regenerated
        // with new content-hashed filenames on every publish) from its own
        // HTTP cache during an update check. service-worker.js's own bytes
        // never change build-to-build (it's a static hand-written wrapper),
        // so without this, the only thing that actually DOES change on a
        // redeploy could be served stale, and the browser's byte-comparison
        // update check could conclude nothing changed at all — a refresh
        // (or several) then keeps rendering the old UI indefinitely, only
        // recovering on a hard refresh or fully closing every open tab.
        // 'none' forces every fetch this service worker makes, imports
        // included, to always bypass HTTP cache, so an update is detected
        // and skipWaiting()/clients.claim() (already in both service worker
        // files) can actually do their job on the very next refresh.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
