# OpenPit32: local, cloud-free Pit Boss grill control over Bluetooth LE.
# See README.md for the full picture; docker/README.md for deploying this.
#
# Configure via a .env file next to this one (copy docker/.env.example) —
# at minimum GRILL_PROXY_HOST (the grill's ESP32, esphome/grill-firmware.yaml)
# and AUTH_USERNAME / AUTH_PASSWORD (the login the app requires — see
# docker/README.md).
#
#   docker compose up -d --build
#
# The grill password itself is NOT set here: use the web app's "Fetch grill
# password" dialog once it's running instead — it calls the ESP32's own
# POST /setup directly (Phase 7, docs/ESP32_FIRMWARE_PLAN.md), which
# persists it to the ESP32's own flash (NVS), not anything in this file.

services:
  # Everything but the login form now lives on the grill's ESP32 itself
  # (Phase 8) — this replaced the old "sidecar" service (Python BLE bridge)
  # once that was fully retired; see docker/auth.Dockerfile.
  auth:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    ports:
      - "8091:8091"
    environment:
      # The login nginx requires for the whole app (docker/nginx.conf.template's
      # auth_request calls this same container's /auth-check). Leaving
      # these unset fails closed — /auth-check always denies — rather than
      # accidentally shipping an open deployment.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Optional: set to invalidate every existing session at once (e.g.
      # after changing AUTH_PASSWORD). Unset, one is generated on first run
      # and persisted in the grill-data volume, so restarts don't log
      # everyone out.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Only matters for hitting this container directly (LAN diagnostics);
      # the browser's normal path through nginx is same-origin and doesn't
      # use it. Must match the origin the browser loads the web app from.
      CORS_ORIGINS: http://${HOST_IP}:${WEB_PORT:-5219}
    volumes:
      - grill-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-5219}:80"
    environment:
      # nginx.conf.template substitutes this for every /api/* route except
      # /login, /logout, /auth-check (the auth service above) — Phases 4-7
      # moved all of that onto the ESP32 directly.
      GRILL_PROXY_HOST: ${GRILL_PROXY_HOST}
    depends_on:
      - auth
    restart: unless-stopped

volumes:
  # Named "grill-data" from before Phase 8, when it also held the grill's
  # BLE password — kept as-is (not renamed) so upgrading in place reuses the
  # existing volume rather than starting from an empty one, which would
  # invalidate every session (a fresh .auth_secret) for no real benefit. All
  # it holds now is that one persisted signing secret.
  grill-data:
