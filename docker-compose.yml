# OpenPit32: local, cloud-free Pit Boss grill control over Bluetooth LE.
# See README.md for the full picture; docker/README.md for deploying this.
#
# Configure via a .env file next to this one (copy docker/.env.example) —
# at minimum GRILL_PROXY_HOST / GRILL_PROXY_KEY (the ESP32 proxy), HOST_IP
# (this machine's LAN address, so the browser and the sidecar's CORS
# allowlist agree on the web app's origin), and AUTH_USERNAME / AUTH_PASSWORD
# (the login the app requires — see docker/README.md).
#
#   docker compose up -d --build
#
# The grill password itself is NOT set here: leave GRILL_BOARD_ID /
# GRILL_PASSWORD unset and use the web app's "Pit Boss account" dialog once
# it's running — it calls the sidecar's /setup, which saves them into the
# grill-data volume.

services:
  sidecar:
    build:
      context: .
      dockerfile: docker/sidecar.Dockerfile
    ports:
      - "8091:8091"
    environment:
      GRILL_PROXY_HOST: ${GRILL_PROXY_HOST}
      GRILL_PROXY_KEY: ${GRILL_PROXY_KEY}
      GRILL_PROXY_PORT: ${GRILL_PROXY_PORT:-6053}
      GRILL_BOARD_ID: ${GRILL_BOARD_ID:-}
      GRILL_PASSWORD: ${GRILL_PASSWORD:-}
      GRILL_MODEL: ${GRILL_MODEL:-PBV5 P2}
      # Must match the origin the browser loads the web app from.
      GRILL_SIDECAR_ORIGINS: http://${HOST_IP}:${WEB_PORT:-5219}
      # The login nginx requires for the whole app (docker/nginx.conf's
      # auth_request calls this same container's /auth-check). Leaving
      # these unset fails closed — /auth-check always denies — rather than
      # accidentally shipping an open deployment.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Optional: set to invalidate every existing session at once (e.g.
      # after changing AUTH_PASSWORD). Unset, one is generated on first run
      # and persisted in the grill-data volume, so restarts don't log
      # everyone out.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Grill/timer alarms (scripts/alarms.py): Web Push over VAPID, no
      # third-party push service account needed. The key pair is generated
      # once and persisted in the grill-data volume alongside the grill
      # password. VAPID_SUBJECT just identifies the sender to push services
      # (a mailto: URI is conventional) — optional, defaults to a placeholder.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - grill-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-5219}:80"
    depends_on:
      - sidecar
    restart: unless-stopped

volumes:
  grill-data:
