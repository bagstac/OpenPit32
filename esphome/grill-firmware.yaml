# Phase 1 (docs/ESP32_FIRMWARE_PLAN.md): the grill talks Mongoose OS RPC
# directly to THIS ESP32 — no PC-side sidecar, no generic bluetooth_proxy
# hop. Deliberately a separate file from esphome/grill-proxy.yaml, not an
# edit to it: that one keeps working as an instant rollback (reflash it)
# until this firmware has proven itself on the bench, per the plan's
# rollout notes. Do not point this at the grill's real ESP32 without
# reading that plan first — same hardware notes apply (BOOT/EN dance for
# the first USB flash, OTA after).
#
# Phase 1 proved the BLE transport (connect, discover, notify, unauth'd
# RPC.Ping). Phase 2 added the auth codec and authenticated PB.GetState.
# Phase 3 decoded the sc_11/sc_12 (FE0B/FE0C) frames into internal state.
# Phase 4 serves that state over /health, /state, /info — the pitboss_grill
# component registers those routes on the web_server_base httpd instance it
# auto-loads, no separate `web_server_base:`/`web_server:` block needed here.
# Phase 5 adds POST /command: turn-on/turn-off/set-temperature, behind the
# same confirm semantics grill_sidecar.py's bridge.command() enforces today.
# Phase 6 adds the alarm monitor loop (GET/POST /alarms, DELETE
# /alarms/{id}) and Telegram notify() — same temp-target/timer semantics as
# today's scripts/alarms.py. Needs real wall-clock time (a timer alarm's
# fires_at has to be a real Unix timestamp GrillDetail.razor can count down
# from), hence the `time:` block below — pitboss_grill picks it up
# automatically via cv.use_id (same pattern as `web_server_base`, which
# needs no explicit block since it's auto_load'd with an empty/default
# config; `http_request:` for the Telegram POST works the same way).
# Phase 7 (this revision) adds POST /setup — the same one-time Pit Boss
# cloud login scripts/pitboss_cloud.py does, now run from the ESP32 itself —
# and NVS persistence for the password it fetches, the alarms list, and the
# Telegram bot token/chat id (POST /config), so none of that resets on a
# reboot/reflash anymore. grill_password below is now only the *initial*
# fallback (NVS wins once POST /setup has run once) — it may be dropped from
# secrets.yaml entirely for a fresh device that will be set up through the
# web app's "Fetch grill password" dialog instead. telegram_bot_token/
# telegram_chat_id are the same story: still settable here for bench
# convenience, but POST /config (not yet wired to any web-app UI — curl it
# directly for now) can set/change them without a reflash too.

esphome:
  name: grill-firmware
  friendly_name: Grill Firmware (dev)

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  logs:
    pitboss_grill: DEBUG

# Phase 6: alarms need a real Unix timestamp (fires_at) for
# GrillDetail.razor's countdown to make sense, not just uptime-since-boot.
# NTP over the WiFi this ESP32 already has; UTC throughout since every
# comparison here is epoch-vs-epoch, no calendar/local-time display anywhere.
time:
  - platform: sntp
    id: sntp_time

esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true
  # Confirmed the grill advertises loudly and correctly (RSSI ~-32dBm,
  # matched by name every ~20-30ms) — removed the debug on_ble_advertise
  # lambda that proved it. It logged every advertisement at INFO level,
  # which combined with pitboss_grill's own per-call debug logging almost
  # certainly caused the WiFi/API instability seen next: this ESP32's
  # single 2.4GHz radio is shared between BLE and WiFi, and hundreds of
  # log lines per second competing for the same core/UART starves the
  # network stack. Lesson for later phases: keep any BLE-scan-frequency
  # logging heavily rate-limited or one-shot, never per-advertisement.

external_components:
  - source:
      type: local
      path: components

pitboss_grill:
  id: grill
  name_prefix: "PBV2-"
  # Phase 7: only the initial fallback now — NVS (POST /setup) wins once
  # it has a value. Safe to drop this line (and grill_password from
  # secrets.yaml) entirely for a device meant to be set up purely through
  # the web app's "Fetch grill password" dialog.
  grill_password: !secret grill_password
  # Telegram (docs/ESP32_FIRMWARE_PLAN.md's "Telegram integration" section):
  # message @BotFather for a bot token, message the new bot once, then GET
  # https://api.telegram.org/bot<TOKEN>/getUpdates to read back the chat id.
  # Both default to "" (no secrets.yaml entry needed to compile) — an alarm
  # still fires and is dropped on schedule either way, it just logs
  # "no Telegram bot configured" instead of actually notifying. Configured
  # 2026-09-10 to verify real delivery — both keys are in secrets.yaml. Like
  # grill_password above, these are Phase 7's initial fallback only — POST
  # /config persists a change to NVS, which then wins on every later boot.
  telegram_bot_token: !secret telegram_bot_token
  telegram_chat_id: !secret telegram_chat_id
